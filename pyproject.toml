[project]
name = "toolforge"
version = "0.1.0"
description = "AI agent platform tự động research + build + list software tools cho MMO/creator Việt"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "wrangler>=3.80",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # line length is handled by formatter

# --- mypy ---
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

# --- coverage ---
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
