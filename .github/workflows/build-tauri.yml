name: Build Tauri + Upload to R2

# Triggered by Worker backend via workflow_dispatch API
# Inputs: build_id, tool_id, version
# Outputs: callback Worker /api/forge/webhook/built with R2 signed URL

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID (e.g. build-capcut-reup-0.1.0)'
        required: true
        type: string
      tool_id:
        description: 'Tool ID (e.g. capcut-reup)'
        required: true
        type: string
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        type: string
      callback_url:
        description: 'Worker URL to POST result back to (e.g. https://toolforge-api.x.workers.dev/api/forge/webhook/built)'
        required: true
        type: string
      webhook_secret:
        description: 'Shared secret to verify webhook auth'
        required: true
        type: string

concurrency:
  group: "tauri-build-${{ inputs.build_id }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.tool_id }} v${{ inputs.version }} (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Update tauri.conf.json with build metadata
        shell: bash
        working-directory: src-tauri
        run: |
          python -c "
          import json
          with open('tauri.conf.json', 'r') as f:
              conf = json.load(f)
          conf['version'] = '${{ inputs.version }}'
          with open('tauri.conf.json', 'w') as f:
              json.dump(conf, f, indent=2)
          "

      - name: Build Tauri (Windows .exe)
        working-directory: src-tauri
        run: |
          cargo tauri build --target x86_64-pc-windows-msvc
          echo "Build complete"
          ls -la target/x86_64-pc-windows-msvc/release/bundle/

      - name: Find generated installer
        shell: bash
        id: find_installer
        run: |
          # Tauri produces .msi (WiX) and/or .exe (NSIS). Prefer .msi.
          MSI=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle -name "*.msi" | head -1)
          if [ -z "$MSI" ]; then
            EXE=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle -name "*setup*.exe" -o -name "*x64*.exe" | head -1)
            INSTALLER="$EXE"
          else
            INSTALLER="$MSI"
          fi
          if [ -z "$INSTALLER" ]; then
            echo "::error::No installer found"
            exit 1
          fi
          echo "installer=$INSTALLER" >> $GITHUB_OUTPUT
          echo "Installer: $INSTALLER"
          ls -la "$INSTALLER"

      - name: Configure AWS (R2)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto
          # R2 endpoint
          endpoint-url: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Upload to R2
        shell: bash
        env:
          BUILD_ID: ${{ inputs.build_id }}
          TOOL_ID: ${{ inputs.tool_id }}
          VERSION: ${{ inputs.version }}
        run: |
          INSTALLER="${{ steps.find_installer.outputs.installer }}"
          R2_KEY="${TOOL_ID}/${VERSION}/setup-${VERSION}.${INSTALLER##*.}"
          echo "Uploading $INSTALLER to r2://toolforge-tools/$R2_KEY"
          aws s3 cp "$INSTALLER" "s3://toolforge-tools/$R2_KEY" \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SIZE=$(stat -c%s "$INSTALLER")
          echo "size=$SIZE"
          echo "r2_key=$R2_KEY" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Generate signed URL (7-day)
        id: signed_url
        shell: bash
        env:
          TOOL_ID: ${{ inputs.tool_id }}
          VERSION: ${{ inputs.version }}
        run: |
          R2_KEY="${{ steps.find_installer.outputs.r2_key }}"
          SIGNED_URL=$(aws s3 presign "s3://toolforge-tools/$R2_KEY" \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --expires-in 604800)
          echo "signed_url=$SIGNED_URL" >> $GITHUB_OUTPUT
          echo "Signed URL generated (7-day expiry)"

      - name: Report success to Worker
        if: success()
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          WEBHOOK_SECRET: ${{ inputs.webhook_secret }}
          BUILD_ID: ${{ inputs.build_id }}
          TOOL_ID: ${{ inputs.tool_id }}
          VERSION: ${{ inputs.version }}
          R2_KEY: ${{ steps.find_installer.outputs.r2_key }}
          SIGNED_URL: ${{ steps.signed_url.outputs.signed_url }}
          SIZE: ${{ steps.find_installer.outputs.size }}
        run: |
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d "{
              \"build_id\": \"$BUILD_ID\",
              \"tool_id\": \"$TOOL_ID\",
              \"version\": \"$VERSION\",
              \"status\": \"success\",
              \"r2_key\": \"$R2_KEY\",
              \"binary_url\": \"$SIGNED_URL\",
              \"size_bytes\": $SIZE,
              \"test_result\": \"pass\"
            }"
          echo "Reported success to Worker"

      - name: Report failure to Worker
        if: failure()
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          WEBHOOK_SECRET: ${{ inputs.webhook_secret }}
          BUILD_ID: ${{ inputs.build_id }}
          TOOL_ID: ${{ inputs.tool_id }}
          VERSION: ${{ inputs.version }}
        run: |
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d "{
              \"build_id\": \"$BUILD_ID\",
              \"tool_id\": \"$TOOL_ID\",
              \"version\": \"$VERSION\",
              \"status\": \"failed\",
              \"error\": \"GH Action build failed - check logs\"
            }" || true
          echo "Reported failure to Worker (best effort)"
